    @font-face {
      font-family: "Parmigiano Sans";
      src: local("Parmigiano Sans"), local("ParmigianoSans");

    }

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #faf8f5;
      --text: #2c2825;
      --muted: #8c8078;
      --accent: #b5785a;
      --card-bg: #ffffff;
      --border: #e8e2da;
    }

    body {
      font-family: 'Parmigiano Sans', 'Assistant', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      direction: ltr; /* default LTR, Hebrew elements override */
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      direction: ltr;
      gap: 8px;
      min-width: 0;
    }
    #header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      direction: ltr;
      flex-shrink: 0;
    }

    #logo-wrap {
      cursor: pointer;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    #header-home-text {
      font-family: 'Parmigiano Sans', 'Assistant', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.07em;
      color: var(--text);
      white-space: nowrap;
      transition: color 0.2s;
    }
    #logo-wrap:hover #header-home-text { color: var(--accent); }

    /* ── SHOP DROPDOWN ── */
    .story-btn {
      padding: 8px 4px;
      background: transparent;
      border: none;
      font-family: 'Parmigiano Sans', 'Assistant', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .story-btn:hover { color: var(--accent); }
    .story-btn.active { color: var(--text); font-weight: 600; }
    .shop-dropdown { position: relative; }

    .shop-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 4px;
      background: transparent;
      border: none;
      font-family: 'Parmigiano Sans', 'Assistant', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
      direction: rtl;
    }
    .shop-btn:hover { color: var(--accent); }
    .shop-btn.open { color: var(--text); font-weight: 600; }
    .shop-btn svg { width: 11px; height: 11px; transition: transform 0.2s; flex-shrink: 0; stroke-width: 2; }
    .shop-btn.open svg { transform: rotate(180deg); }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      left: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      min-width: 180px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      z-index: 200;
      overflow: hidden;
      direction: rtl;
    }
    .dropdown-menu.open { display: block; }
    .dropdown-menu button {
      display: block;
      width: 100%;
      padding: 13px 20px;
      text-align: right;
      border: none;
      background: transparent;
      font-family: 'Parmigiano Sans', 'Assistant', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid var(--border);
    }
    .dropdown-menu button:last-child { border-bottom: none; }
    .dropdown-menu button:hover { background: var(--bg); color: var(--accent); }
    .dropdown-menu button.active { color: var(--accent); font-weight: 600; background: #fff5f0; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #footer-credit {
      font-family: 'Parmigiano Sans', 'Assistant', sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    .footer-social {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .footer-social a,

      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      text-decoration: none;
      transition: all 0.2s;

    .icon-whatsapp, .icon-instagram, .icon-email {
      background: transparent;
      border: none;
    }
    .icon-whatsapp:hover, .icon-instagram:hover, .icon-email:hover {
      opacity: 0.85;
      transform: scale(1.08);
    }

    /* ── MAIN ── */
    main { max-width: 100%; margin: 0; padding: 0; }

    /* ── SPLASH ── */
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      text-align: center;
      padding-top: 0;
    }
#splash-logo {
      width: 50vw;
      height: auto;
      object-fit: contain;
      display: none;
      padding: 28px 0 20px;
    }
    @media (max-width: 768px) {
      #splash-logo { width: 85vw; }
    }


    /* ── TAG GALLERY on splash ── */
    #tag-gallery {
      width: 100%;
      padding: 40px 24px 60px;
      display: none;
    }
    @media (max-width: 600px) {
      #tag-gallery { padding: 0 0 40px; }

    .tag-gallery-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 980px;
      margin: 0 auto;
    }
    .tag-tile {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      width: 220px;
      height: 220px;
      flex-shrink: 0;
      background: var(--border);
      transition: transform 0.25s, box-shadow 0.25s;

    @media (max-width: 600px) {

      .tag-tile { width: 75vw; height: 56vw; border-radius: 6px; }

    .tag-tile img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .tag-tile-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(44,40,37,0.38);
      color: white;
      font-family: 'Parmigiano Sans', 'Assistant', sans-serif;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-align: center;
      transition: background 0.2s;
      direction: rtl;
    }
    .tag-tile:hover .tag-tile-label { background: rgba(44,40,37,0.55); }
    /* ── SHOP VIEW ── */
    #shop-view { display: none; max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }

    .view-title {

      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-bottom: 32px;
      text-align: right;
      direction: rtl;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      position: relative;

    .view-title::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: 0;
      width: 48px;
      height: 2px;
      background: var(--accent);
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: box-shadow 0.25s, transform 0.25s;
      cursor: pointer;
      direction: rtl;
    }
    .card:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.09); transform: translateY(-3px); }
    .card.is-sold { opacity: 0.72; }

    .card-img-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/3;
      display: block;
      background: var(--border);
    }
    .card-img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.8s ease;
      opacity: 0;
    }
    .card-img-wrap img.visible { opacity: 1; }
    .multi-indicator {
      position: absolute; bottom: 8px; right: 8px;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,0.85);
      display: flex; align-items: center; justify-content: center;

    .multi-indicator::after { content: "⊞"; font-size: 11px; color: var(--text); line-height:1; }
    .lb-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.5); cursor: pointer; transition: background 0.2s;
    }
    .lb-dot.active { background: white; }

    .stock-pill {
      font-family: 'Parmigiano Sans', 'Assistant', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 3px 8px;

    .stock-2    { background: rgba(255,255,255,0.93); color: #8a6820; border: 1px solid #e0d080; }
    .stock-3    { background: rgba(255,255,255,0.93); color: #4a7a4a; border: 1px solid #a0c8a0; }

    .stock-sold { background: rgba(44,40,37,0.72);   color: #e8e2da; border: 1px solid transparent; }

    .card-body  { padding: 14px 16px 16px; text-align: right; }
    .card-name  { font-family: 'Parmigiano Sans', 'Assistant', sans-serif; font-size: 1rem; font-weight: 400; color: var(--text); margin-bottom: 8px; }
    .card-bottom { display: flex; align-items: center; justify-content: space-between; flex-direction: row-reverse; gap: 6px; }
    .card-price { font-family: 'Parmigiano Sans', 'Assistant', sans-serif; font-size: 0.85rem; color: var(--accent); font-weight: 300; }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30,26,22,0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #lightbox.open { display: flex; }
    #lightbox-inner { background: white; border-radius: 4px; max-width: 680px; width: 100%; overflow: hidden; direction: rtl; }
    #lightbox-img   { width: 100%; max-height: 65vh; object-fit: contain; background: var(--bg); display: block; }
    #lightbox-info  { padding: 20px 24px 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; direction: rtl; }
    #lightbox-contact-label { font-family: 'Parmigiano Sans', 'Assistant', sans-serif; font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; text-align: center; }
    #lightbox-name   { font-family: 'Parmigiano Sans', 'Assistant', sans-serif; font-size: 1.2rem; font-weight: 600; }
    #lightbox-price  { font-family: 'Parmigiano Sans', 'Assistant', sans-serif; font-size: 1rem; color: var(--accent); margin-top: 4px; }
    #lightbox-status { font-family: 'Parmigiano Sans', 'Assistant', sans-serif; font-size: 0.85rem; margin-top: 5px; }
    #lightbox-close  { position: absolute; top: 16px; left: 20px; font-size: 1.8rem; color: white; cursor: pointer; line-height: 1; background: none; border: none; }

    .state-msg {
      grid-column: 1/-1;
      text-align: center;
      color: var(--muted);
      font-family: 'Parmigiano Sans', 'Assistant', sans-serif;
      padding: 60px 0;
      font-size: 1rem;
    }
    .loading-msg {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      direction: rtl;
    }
    .loading-msg::before {
      content: '';
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      #story-splash-img { width: 100vw !important; }
      #story-text-img   { width: 100vw !important; }
    }
    /* ── MOBILE ── */
    @media (max-width: 600px) {
      header { padding: 10px 12px; gap: 6px; }
      #header-home-text { font-size: 0.78rem; letter-spacing: 0.02em; }
      .shop-btn { font-size: 0.82rem; }
      .story-btn { font-size: 0.82rem; }
      footer { padding: 16px 20px; }
    }
  </style>
</head>

<script>
// ── Setup ─────────────────────────────────────────────────────────────────
document.getElementById('footer-mail').href      = 'mailto:' + CONFIG.contactEmail;
document.getElementById('footer-credit').textContent = '© ' + CONFIG.artistName;

// Escape user-controlled text (item names come from Drive filenames)
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ── Stock metadata ────────────────────────────────────────────────────────
const STOCK_META = {
  "1":    { label: "יחידה אחת", pillClass: "stock-1"   },
  "2":    { label: "2 יחידות",    pillClass: "stock-2"   },
  "3":    { label: "3 יחידות",    pillClass: "stock-3"   },
  "4":    { label: "4 יחידות",    pillClass: "stock-4"   },
  "sold": { label: "נמכר",        pillClass: "stock-sold" },
};

function stockStatusText(units) {
  if (units === 'sold') return 'נמכר — לא זמין יותר';
  return units === '1' ? 'פריט אחד זמין' : `${units} פריטים זמינים`;
}

// Price label — "ליחידה" only when more than one unit is available
function priceText(price, units) {
  if (price === 'N/A') return '';
  return `₪${price}` + (['2','3','4'].includes(units) ? ' ליחידה' : '');
}

// ── Parse filename: "name(number)_price_tag.jpg" ─────────────────────────
function parseFilename(rawName) {
  const noExt    = rawName.replace(/\.[^/.]+$/, '');
  const parts    = noExt.split('_');
  const namePart = (parts[0] || '').replace(/-/g, ' ').trim();
  // Extract image number from parentheses e.g. "blue bowl(2)" → name="blue bowl", imgNum=2
  const parenMatch = namePart.match(/^(.+?)\s*\((\d+)\)\s*$/);
  const name    = parenMatch ? parenMatch[1].trim() : namePart;
  const imgNum  = parenMatch ? parseInt(parenMatch[2]) : 1;
  const price   = parts[1] !== undefined && !isNaN(Number(parts[1]))
                   ? Number(parts[1]) : 'N/A';
  const tag     = parts[2] ? parts[2].trim().toLowerCase() : 'other';
  return { name, price, tag, imgNum };
}

// ── Fetch images from Drive folder ───────────────────────────────────────
async function fetchDriveImages(folderId) {
  const url = `https://www.googleapis.com/drive/v3/files`
    + `?q=%27${folderId}%27+in+parents+and+mimeType+contains+%27image/%27`
    + `&fields=files(id,name)&pageSize=1000&key=${CONFIG.apiKey}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Drive API ${res.status} for folder ${folderId}`);
  const data = await res.json();
  return data.files || [];
}

// ── All items cache ───────────────────────────────────────────────────────
let allItems = [];

async function loadAllItems() {
  // Load folders independently — one failing folder shouldn't empty the whole gallery
  const results = await Promise.allSettled([
    fetchDriveImages(CONFIG.folderIds["1"]),
    fetchDriveImages(CONFIG.folderIds["2"]),
    fetchDriveImages(CONFIG.folderIds["3"]),
    fetchDriveImages(CONFIG.folderIds["4"]),
    fetchDriveImages(CONFIG.folderIds["sold"]),
  ]);
  const [f1, f2, f3, f4, fSold] = results.map(r => {
    if (r.status === 'rejected') { console.error('Folder load failed:', r.reason); return []; }
    return r.value;
  });

  // Map raw files to individual image objects
  const mapRaw = (files, units) => files.map(f => {
    const { name, price, tag, imgNum } = parseFilename(f.name);
    return { name, price, tag, units, imgNum,
             img: `https://drive.google.com/thumbnail?id=${f.id}&sz=w800` };
  });
  const raw = [
    ...mapRaw(f1,"1"), ...mapRaw(f2,"2"),
    ...mapRaw(f3,"3"), ...mapRaw(f4,"4"),
    ...mapRaw(fSold,"sold"),
  ];

  // Group by name+price+tag+units → collect all images into imgs[]
  const groups = {};
  raw.forEach(r => {
    const key = `${r.name}||${r.price}||${r.tag}||${r.units}`;
    if (!groups[key]) groups[key] = { name: r.name, price: r.price,
                                      tag: r.tag, units: r.units, imgs: [] };
    groups[key].imgs[r.imgNum - 1] = r.img; // place by index
  });
  // Clean up any gaps and ensure at least one image
  allItems = Object.values(groups).map(g => {
    g.imgs = g.imgs.filter(Boolean);
    g.img  = g.imgs[0]; // primary image for backwards compat
    return g;
  });

  buildDropdown();

  // If nothing loaded because Drive was unreachable, tell the visitor
  if (!allItems.length && results.some(r => r.status === 'rejected')) {
    document.getElementById('tag-gallery-grid').innerHTML =
      '<p class="state-msg">הגלריה לא נטענה כרגע — נסו לרענן את הדף.</p>';
  }
}

// ── Build dropdown ────────────────────────────────────────────────────────
function buildDropdown() {
  const tags = [...new Set(allItems.map(i => i.tag))].sort();

  // Dropdown menu
  const menu = document.getElementById('dropdown-menu');
  menu.innerHTML = '';
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.textContent = tag.charAt(0).toUpperCase() + tag.slice(1);
    btn.dataset.tag = tag;
    btn.onclick = () => showTag(tag);
    menu.appendChild(btn);
  });

  // Tag gallery on splash
  const galleryGrid = document.getElementById('tag-gallery-grid');
  galleryGrid.innerHTML = '';
  tags.forEach(tag => {
    const tagItems = allItems.filter(i => i.tag === tag);
    if (!tagItems.length) return;
    // Pick a random available item, fall back to any
    const available = tagItems.filter(i => i.units !== 'sold');
    const pick = available.length
      ? available[Math.floor(Math.random() * available.length)]
      : tagItems[Math.floor(Math.random() * tagItems.length)];

    const tile = document.createElement('div');
    tile.className = 'tag-tile';
    tile.innerHTML = `
      <img src="${esc(pick.img)}" alt="${esc(tag)}" loading="lazy"/>
      <div class="tag-tile-label">${esc(tag.charAt(0).toUpperCase() + tag.slice(1))}</div>`;
    tile.addEventListener('click', () => showTag(tag));
    galleryGrid.appendChild(tile);
  });
}

// ── Toggle dropdown ───────────────────────────────────────────────────────
function toggleShopMenu() {
  document.getElementById('shop-btn').classList.toggle('open');
  document.getElementById('dropdown-menu').classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!document.getElementById('shop-dropdown').contains(e.target)) {
    document.getElementById('shop-btn').classList.remove('open');
    document.getElementById('dropdown-menu').classList.remove('open');
  }
});

// ── History / back-button support ─────────────────────────────────────────
// Each view change pushes a history entry (#story, #gallery/<tag>), so the
// browser back button moves between views instead of leaving the site.
let suppressHistory = false;
let currentViewKey  = 'home';

function syncHistory(key, hash) {
  if (suppressHistory || currentViewKey === key) return;
  currentViewKey = key;
  history.pushState(null, '', hash || location.pathname + location.search);
}

function renderFromHash() {
  let hash = location.hash;
  try { hash = decodeURIComponent(hash); } catch (e) {}
  suppressHistory = true;
  if (hash.startsWith('#gallery/')) {
    const tag = hash.slice('#gallery/'.length);
    if (allItems.some(i => i.tag === tag)) {
      currentViewKey = 'tag:' + tag;
      showTag(tag);
    } else {
      currentViewKey = 'home';
      showSplash();
    }
  } else if (hash === '#story') {
    currentViewKey = 'story';
    showStory();
  } else {
    currentViewKey = 'home';
    showSplash();
  }
  suppressHistory = false;
}
window.addEventListener('popstate', renderFromHash);

// ── Show splash ───────────────────────────────────────────────────────────
function showSplash() {
  document.getElementById('splash').style.display      = 'flex';
  document.getElementById('tag-gallery').style.display = 'block';
  document.getElementById('shop-view').style.display   = 'none';
  document.getElementById('story-view').style.display  = 'none';
  document.querySelectorAll('.dropdown-menu button').forEach(b => b.classList.remove('active'));
  document.querySelector('.story-btn').classList.remove('active');
  document.getElementById('shop-btn').classList.remove('open');
  document.getElementById('dropdown-menu').classList.remove('open');
  syncHistory('home', '');
}

// ── Show story page ───────────────────────────────────────────────
function showStory() {
  document.getElementById('splash').style.display      = 'none';
  document.getElementById('tag-gallery').style.display = 'none';
  document.getElementById('shop-view').style.display   = 'none';
  const sv = document.getElementById('story-view');
  sv.style.display = 'flex';
  document.querySelector('.story-btn').classList.add('active');
  document.querySelectorAll('.dropdown-menu button').forEach(b => b.classList.remove('active'));
  document.getElementById('shop-btn').classList.remove('open');
  document.getElementById('dropdown-menu').classList.remove('open');
  syncHistory('story', '#story');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Show tag ──────────────────────────────────────────────────────────────
function showTag(tag) {
  document.getElementById('shop-btn').classList.remove('open');
  document.getElementById('dropdown-menu').classList.remove('open');
  document.querySelectorAll('.dropdown-menu button').forEach(b =>
    b.classList.toggle('active', b.dataset.tag === tag)
  );
  const available = allItems.filter(i => i.tag === tag && i.units !== 'sold');
  const sold      = allItems.filter(i => i.tag === tag && i.units === 'sold');
  const items     = [...available, ...sold];

  document.getElementById('view-title').textContent =
    tag.charAt(0).toUpperCase() + tag.slice(1);
  const grid = document.getElementById('shop-grid');
  clearCardTimers();
  grid.innerHTML = '';
  if (!items.length) {
    grid.innerHTML = `<p class="state-msg">אין פריטים כאן עדיין.</p>`;
  } else {
    items.forEach(item => grid.appendChild(makeCard(item)));
  }
  document.getElementById('splash').style.display      = 'none';
  document.getElementById('tag-gallery').style.display = 'none';
  document.getElementById('story-view').style.display  = 'none';
  document.getElementById('shop-view').style.display   = 'block';
  document.querySelector('.story-btn').classList.remove('active');
  syncHistory('tag:' + tag, '#gallery/' + encodeURIComponent(tag));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Make card ─────────────────────────────────────────────────────────────
// Crossfade timers of the cards currently on screen — cleared before every
// grid rebuild so discarded cards don't keep ticking in the background.
let cardTimers = [];
function clearCardTimers() {
  cardTimers.forEach(clearInterval);
  cardTimers = [];
}

function makeCard({ name, imgs, img, units, price }) {
  const meta         = STOCK_META[units];
  const priceDisplay = priceText(price, units);
  const allImgs      = imgs && imgs.length ? imgs : [img];
  const card         = document.createElement('div');
  card.className     = 'card' + (units === 'sold' ? ' is-sold' : '');
  card.innerHTML     = `
    <div class="card-img-wrap">
      <img class="card-main-img visible" src="${esc(allImgs[0])}" alt="${esc(name)}" loading="lazy"/>
      ${allImgs.length > 1 ? '<div class="multi-indicator"></div>' : ''}
    </div>
    <div class="card-body">
      <div class="card-name">${esc(name)}</div>
      <div class="card-bottom">
        ${priceDisplay ? `<div class="card-price">${priceDisplay}</div>` : '<div></div>'}
        <span class="stock-pill ${meta.pillClass}">${meta.label}</span>
      </div>
    </div>`;

  // Crossfade rotation — stack all images, fade one in at a time
  if (allImgs.length > 1) {
    const wrap = card.querySelector('.card-img-wrap');
    // Replace the single img with a stack of all images
    wrap.innerHTML = (allImgs.length > 1 ? '<div class="multi-indicator"></div>' : '');
    const imgEls = allImgs.map((src, i) => {
      const el = document.createElement('img');
      el.src = src;
      el.alt = name;
      el.loading = 'lazy';
      if (i === 0) el.classList.add('visible');
      wrap.appendChild(el);
      return el;
    });
    let cur = 0;
    cardTimers.push(setInterval(() => {
      imgEls[cur].classList.remove('visible');
      cur = (cur + 1) % imgEls.length;
      imgEls[cur].classList.add('visible');
    }, 2500));
  }

  card.addEventListener('click', () => openLightbox({ name, imgs: allImgs, units, price }));
  return card;
}

// ── Lightbox ──────────────────────────────────────────────────────────────
let _lbImgs = [], _lbIdx = 0;

function openLightbox({ name, imgs, img, units, price }) {
  _lbImgs = imgs && imgs.length ? imgs : [img];
  _lbIdx  = 0;
  updateLightboxImage();
  document.getElementById('lightbox-name').textContent  = name;
  document.getElementById('lightbox-price').textContent = priceText(price, units);
  const statusEl = document.getElementById('lightbox-status');
  statusEl.textContent = stockStatusText(units);
  statusEl.style.color = units === 'sold' ? '#7a4a4a' : '#4a7a4a';
  const actions = document.getElementById('lightbox-actions');
  if (units !== 'sold') {
    actions.style.display = 'flex';
    const waMsg = "היי! ראיתי את המוצר " + name + " באתר ואני אשמח לקבל יותר פרטים לגביו\n" + CONFIG.siteUrl;
    document.getElementById('lightbox-whatsapp').href =
      `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(waMsg)}`;
  } else {
    actions.style.display = 'none';
  }
  // Show/hide nav arrows
  const prev = document.getElementById('lb-prev');
  const next = document.getElementById('lb-next');
  const dots = document.getElementById('lb-dots');
  if (_lbImgs.length > 1) {
    prev.style.display = 'flex'; next.style.display = 'flex';
    updateLightboxDots();
    dots.style.display = 'flex';
  } else {
    prev.style.display = 'none'; next.style.display = 'none';
    dots.style.display = 'none';
  }
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateLightboxImage() {
  const imgEl = document.getElementById('lightbox-img');
  imgEl.style.opacity = '0';
  setTimeout(() => { imgEl.src = _lbImgs[_lbIdx]; imgEl.style.opacity = '1'; }, 150);
}

function updateLightboxDots() {
  const dots = document.getElementById('lb-dots');
  dots.innerHTML = _lbImgs.map((_, i) =>
    `<span class="lb-dot${i === _lbIdx ? ' active' : ''}" onclick="lbGoTo(${i})"></span>`
  ).join('');
}

function lbGoTo(idx) {
  _lbIdx = idx;
  updateLightboxImage();
  updateLightboxDots();
}

function lbPrev() { lbGoTo((_lbIdx - 1 + _lbImgs.length) % _lbImgs.length); }
function lbNext() { lbGoTo((_lbIdx + 1) % _lbImgs.length); }

function closeLightbox(e) {
  if (e && e.target !== document.getElementById('lightbox') &&
           e.target !== document.getElementById('lightbox-close')) return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

// Keyboard — Escape closes, arrow keys match the on-screen ‹ › buttons
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft'  && _lbImgs.length > 1) lbPrev();
  else if (e.key === 'ArrowRight' && _lbImgs.length > 1) lbNext();
});

// Touch — horizontal swipe on the image navigates between photos
let _lbTouchStart = null;
const _lbImgWrap = document.getElementById('lightbox-img').parentElement;
_lbImgWrap.addEventListener('touchstart', e => {
  _lbTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
_lbImgWrap.addEventListener('touchend', e => {
  if (!_lbTouchStart || _lbImgs.length < 2) { _lbTouchStart = null; return; }
  const dx = e.changedTouches[0].clientX - _lbTouchStart.x;
  const dy = e.changedTouches[0].clientY - _lbTouchStart.y;
  _lbTouchStart = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) (dx > 0 ? lbPrev() : lbNext());
}, { passive: true });

// ── Load logo folder (Logo + Text images) ────────────────────────────────
async function loadLogoFolder() {
  try {
    const files = await fetchDriveImages(CONFIG.logoFolderId);



    // Splash image — used in story page only
    const splashFile = files.find(f =>
      f.name.replace(/\.[^/.]+$/, '').toLowerCase() === 'splash image'
    );

    // Logo — file named "Logo"
    const logoFile = files.find(f =>
      f.name.replace(/\.[^/.]+$/, '').toLowerCase() === 'logo'
    );
    if (logoFile) {
      const sl = document.getElementById('splash-logo');
      if (sl) { sl.src = `https://drive.google.com/thumbnail?id=${logoFile.id}&sz=w1200`; sl.style.display = 'block'; }
    }

    // Text image — used in story page only
    const textFile = files.find(f =>
      f.name.replace(/\.[^/.]+$/, '').toLowerCase() === 'text'
    );

    // Story page images
    const storyHero = document.getElementById('story-splash-img');
    const storyText = document.getElementById('story-text-img');
    if (splashFile && storyHero) {
      storyHero.src = `https://drive.google.com/thumbnail?id=${splashFile.id}&sz=w1600`;
    }
    if (textFile && storyText) {
      storyText.src = `https://drive.google.com/thumbnail?id=${textFile.id}&sz=w1200`;
    }

    // Contact icons — WA, IG, Mail images from logo folder
    const waFile   = files.find(f => f.name.replace(/\.[^/.]+$/, '').toLowerCase() === 'wa');
    const igFile   = files.find(f => f.name.replace(/\.[^/.]+$/, '').toLowerCase() === 'ig');
    const mailFile = files.find(f => f.name.replace(/\.[^/.]+$/, '').toLowerCase() === 'mail');

    function setIconSrc(ids, fileObj) {
      if (!fileObj) { console.warn('Icon file not found'); return; }
      const src = `https://drive.google.com/thumbnail?id=${fileObj.id}&sz=w200`;
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.innerHTML = `<img src="${src}" style="width:36px;height:36px;border-radius:8px;object-fit:cover;display:block;" alt="" onerror="this.parentElement.innerHTML='?'"/>`;
        } else {
          console.warn('Icon element not found:', id);
        }
      });
    }
    setIconSrc(['footer-wa', 'lightbox-whatsapp'], waFile);
    setIconSrc(['footer-ig', 'lightbox-instagram'], igFile);
    setIconSrc(['footer-mail'], mailFile);

  } catch(e) {
    console.error('loadLogoFolder error:', e);
  }
}

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  showSplash();
  document.getElementById('tag-gallery-grid').innerHTML =
    '<p class="state-msg loading-msg">טוען גלריה…</p>';
  await Promise.all([loadLogoFolder(), loadAllItems()]);
  // Deep link: render #gallery/<tag> or #story once items are available
  if (location.hash) renderFromHash();
}
init();
</script>
